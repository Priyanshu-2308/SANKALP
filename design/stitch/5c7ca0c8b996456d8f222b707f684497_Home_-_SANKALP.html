<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

"0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "margin": "3rem", "space-md": "1rem", "gutter-mobile": "1rem", "space-xs": "0.25rem", "gutter": "1.5rem", "space-xl": "2.5rem", "space-lg": "1.5rem", "margin-mobile": "1.25rem" }, "fontFamily": { "display-lg": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "display-lg-mobile": ["Inter"] }, "fontSize": { "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "500" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.015em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface-container-lowest font-body-md text-on-surface antialiased"><header class="fixed top-0 left-0 right-0 z-40 bg-surface-container-lowest"><div class="h-16 max-w-[960px] mx-auto px-gutter-mobile md:px-margin flex items-center justify-between"><a class="font-label-lg text-label-lg tracking-[0.2em] uppercase text-on-surface font-medium select-none" data-path="focus-workspace" href="#">SANKALP</a><div class="flex items-center gap-space-lg"><nav class="flex items-center gap-space-md" data-active-classes="text-on-surface font-medium"><a aria-current="page" class="transition-colors text-on-surface font-medium" data-path="focus-workspace" href="#">Focus</a><a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="archive" href="#">Archive</a><a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="preferences" href="#">Preferences</a></nav><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="w-full min-h-screen pt-16 bg-surface-container-lowest flex flex-col items-center"><div class="w-full max-w-[960px] mx-auto px-gutter-mobile md:px-margin flex-1 flex flex-col"><div class="flex flex-col w-full">
<div class="w-full flex flex-col items-center justify-center min-h-[calc(100vh-9rem)] px-gutter-mobile md:px-0">
<div class="w-full max-w-[600px] flex flex-col items-center">
<div class="text-center mb-space-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface font-medium tracking-tight">
          Find your alternative route.
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
          Instant multi-modal alternatives when schedules fail.
        </p>
</div>
<form class="w-full bg-surface-container-lowest border border-surface-container-high rounded-xl p-space-lg flex flex-col gap-space-md" id="route-form" onsubmit="event.preventDefault(); handleSearch();">
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="from-input">
              From
            </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest border border-surface-container-high rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-on-surface transition-colors" id="from-input" placeholder="Departure station or city" required="" type="text"/>
<button class="hidden md:flex absolute -right-3.5 z-10 w-7 h-7 bg-surface-container-lowest border border-surface-container-high rounded-full items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="swap-btn" onclick="swapInputs()" title="Swap stations" type="button">
<span class="material-symbols-outlined text-[15px]">swap_horiz</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="to-input">
              To
            </label>
<input class="w-full bg-surface-container-lowest border border-surface-container-high rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-on-surface transition-colors" id="to-input" placeholder="Destination station or city" required="" type="text"/>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="arrive-input">
              Must arrive by
            </label>
<input class="w-full bg-surface-container-lowest border border-surface-container-high rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-on-surface transition-colors" id="arrive-input" placeholder="e.g. Today, 6:00 PM" type="text"/>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="budget-input">
              Budget
            </label>
<input class="w-full bg-surface-container-lowest border border-surface-container-high rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-on-surface transition-colors" id="budget-input" placeholder="e.g. ₹2,500 or Max budget" type="text"/>
</div>
</div>
<div class="pt-space-xs">
<button class="w-full bg-primary-container hover:bg-primary active:bg-on-primary-fixed-variant text-on-primary font-label-lg text-label-lg py-2.5 rounded-lg transition-colors flex items-center justify-center gap-space-xs select-none" id="submit-btn" type="submit">
<span>Find alternatives</span>
</button>
</div>
</form>
<div class="flex items-center gap-space-md mt-space-md text-on-surface-variant font-label-sm text-label-sm">
<span>Recent:</span>
<button class="hover:text-on-surface transition-colors underline underline-offset-4 decoration-surface-container-high" onclick="fillQuick('New Delhi', 'Jaipur Junction', 'Today, 8:00 PM', '₹1,500')" type="button">NDLS → JP</button>
<span class="text-outline">·</span>
<button class="hover:text-on-surface transition-colors underline underline-offset-4 decoration-surface-container-high" onclick="fillQuick('Howrah', 'Bhubaneswar', 'Tomorrow, 9:00 AM', '₹2,000')" type="button">HWH → BBS</button>
<span class="text-outline">·</span>
<button class="hover:text-on-surface transition-colors underline underline-offset-4 decoration-surface-container-high" onclick="fillQuick('Pune Junction', 'Mumbai CSMT', 'Today, 5:30 PM', '₹800')" type="button">PUNE → CSMT</button>
</div>
</div>
</div>
<script>
    function swapInputs() {
      const from = document.getElementById('from-input');
      const to = document.getElementById('to-input');
      const temp = from.value;
      from.value = to.value;
      to.value = temp;
    }

    function fillQuick(from, to, arrive, budget) {
      document.getElementById('from-input').value = from;
      document.getElementById('to-input').value = to;
      document.getElementById('arrive-input').value = arrive;
      document.getElementById('budget-input').value = budget;
    }

    function handleSearch() {
      const btn = document.getElementById('submit-btn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>Searching routes...</span>';
      btn.disabled = true;
      btn.classList.add('opacity-75');

      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.classList.remove('opacity-75');
      }, 700);
    }
  </script>
</div></div></main><footer class="w-full bg-surface-container-lowest py-space-xl"><div class="max-w-[960px] mx-auto px-gutter-mobile md:px-margin flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm"><span class="tracking-[0.1em] uppercase">Sankalp · Quiet Workspace</span><span class="text-outline">Frictionless</span></div></footer></body></html>
