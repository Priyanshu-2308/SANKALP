[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sankalp-engine"
version = "0.1.0"
description = "Pure Python decision engine for the SANKALP journey-recovery system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sankalp_engine*"]
